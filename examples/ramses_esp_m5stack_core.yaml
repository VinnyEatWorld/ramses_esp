# Compile/configuration example for the M5Stack Core Basic + M5Stack M146.
# Set M146 SW1-2 ON for CSN -> GPIO15, SW2-1 ON for GDO2 -> GPIO35, and
# SW2-5 ON for GDO0 -> GPIO13. These switch pairs follow the official schematic.
# GPIO15 is an ESP32 strapping pin; see the component README before hardware use.
# If your ESPHome node already defines this SPI bus, reuse that bus and its ID.
esphome:
  name: ramses-esp-core-basic

external_components:
  - source:
      type: git
      url: https://github.com/VinnyEatWorld/ramses_esp
      ref: esphome-m5stack-core
    components: [ramses_esp]


esp32:
  board: m5stack-core-esp32
  framework:
    type: esp-idf

logger:

spi:
  id: ramses_spi
  clk_pin: 18
  mosi_pin: 23
  miso_pin: 19

uart:
  id: ramses_uart
  rx_pin: 35
  baud_rate: 38400
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_full_threshold: 1

ramses_esp:
  id: ramses_gateway_radio
  spi_id: ramses_spi
  uart_id: ramses_uart
  cs_pin: 15
  # RAMSES unit and peer IDs are learned through the explicit binding flow.

sensor:
  - platform: ramses_esp
    ramses_esp_id: ramses_gateway_radio
    type: co2
    name: "Ventilation CO2"
  - platform: ramses_esp
    ramses_esp_id: ramses_gateway_radio
    type: boost_duration
    name: "Requested boost duration"

text_sensor:
  - platform: ramses_esp
    ramses_esp_id: ramses_gateway_radio
    type: fan_mode
    name: "Ventilation mode"

binary_sensor:
  - platform: ramses_esp
    ramses_esp_id: ramses_gateway_radio
    type: co2_sensor_presence
    name: "CO2 sensor presence"
